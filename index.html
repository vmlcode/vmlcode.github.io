<script>
  // Applied before first paint so the stored theme never flashes the wrong
  // palette, and so the document is tagged with the right language from the
  // start — the rest of the copy arrives with content/<lang>/*.json.
  try {
    var t = localStorage.getItem('vm-theme');
    if (t) document.documentElement.setAttribute('data-vm-theme', t);
    var l = localStorage.getItem('vm-lang');
    if (l === 'en' || l === 'es') document.documentElement.setAttribute('lang', l);
  } catch (e) {}
</script>
